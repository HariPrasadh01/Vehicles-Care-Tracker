spring.application.name=vehicle-care-tracker
server.port=8080

# File-based H2 database: data survives restarts (stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/vehiclecare
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Daily reminder digest. Format: second minute hour day month weekday
app.reminder.cron=0 0 8 * * *
# A service reminder becomes DUE_SOON this many days / km before the due point
app.reminder.service-days-ahead=30
app.reminder.service-km-ahead=500

